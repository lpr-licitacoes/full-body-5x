<title>Full Body — Treinador</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#111827}
header{background:#111827;color:#fff;padding:17px;position:sticky;top:0;z-index:10}
h1{margin:0;font-size:21px}.sub{font-size:13px;opacity:.82;margin-top:4px}
main{max-width:820px;margin:auto;padding:12px}.week,.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.week{flex-wrap:wrap}
.week div,.tab{background:#fff;padding:9px;border-radius:10px;font-size:12px}.tab{border:0;font-weight:bold;white-space:nowrap}.active{background:#111827!important;color:#fff}
.card{background:#fff;padding:15px;border-radius:17px;margin-bottom:12px;box-shadow:0 2px 10px #00000010}
.exercise{border-top:1px solid #e5e7eb;padding:16px 0}.exercise:first-child{border-top:0}
.exhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.exname{font-weight:bold;font-size:16px}
.arrow{border:0;background:#eef2ff;border-radius:10px;font-size:18px;width:42px;height:38px}.meta,.small{font-size:13px;color:#6b7280;margin:5px 0}
.stim{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:7px}.stimname{font-size:12px;font-weight:bold;background:#ede9fe;color:#5b21b6;border-radius:8px;padding:5px 8px}
.infoBtn{border:0;border-radius:50%;width:25px;height:25px;background:#2563eb;color:#fff;font-weight:bold;cursor:pointer}
.progress{height:9px;background:#e5e7eb;border-radius:8px;overflow:hidden}.bar{height:100%;background:#16a34a}
.set{background:#f9fafb;border-radius:12px;padding:10px;margin:8px 0}.settitle{font-size:12px;font-weight:bold;margin-bottom:7px;color:#374151}
.row{display:flex;gap:7px}.row input,.row select,textarea{border:1px solid #d1d5db;border-radius:10px;padding:10px;font-size:14px;background:#fff;width:100%}.row input{flex:1}
textarea{min-height:70px;font-family:Arial;margin-top:7px}.check,.save,.historybtn,.altbtn{color:#fff;border:0;border-radius:10px;padding:11px;font-weight:bold;width:100%;margin-top:8px}
.check{background:#16a34a}.save{background:#111827}.historybtn{background:#2563eb}.altbtn{background:#7c3aed}.done{opacity:.65}.done .exname{text-decoration:line-through}
.timer{background:#111827;color:#fff;text-align:center;padding:15px;border-radius:17px;margin-bottom:12px}.time{font-size:36px;font-weight:bold}.timer button{margin:3px;padding:9px;border:0;border-radius:9px}
.history{background:#f9fafb;border-radius:10px;padding:10px;margin-top:8px;font-size:13px}.hidden{display:none}.badge{display:inline-block;background:#e5e7eb;border-radius:8px;padding:4px 8px;font-size:11px;margin-left:5px}
.alts{background:#f5f3ff;border:1px solid #ddd6fe;border-radius:12px;padding:12px;margin-top:10px}.alts h4{margin:0 0 8px;color:#5b21b6}
.altitem{background:#fff;border-radius:10px;padding:10px;margin:7px 0;border:1px solid #e5e7eb}.altitem b{display:block}.altitem span{font-size:12px;color:#6b7280}
.altchosen{background:#ede9fe;border:1px solid #8b5cf6;padding:8px;border-radius:9px;margin-top:8px;font-size:13px;color:#5b21b6}
.section-title{font-size:18px;font-weight:bold;margin-bottom:5px}.goal{border-left:4px solid #16a34a;background:#f0fdf4}.corinfo{border-left:4px solid #f59e0b;background:#fffbeb}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:10px}
.modalbox{background:#fff;border-radius:18px 18px 10px 10px;max-width:560px;width:100%;padding:18px;max-height:80vh;overflow:auto}
.modalbox h3{margin:0 0 8px}.close{float:right;border:0;background:#e5e7eb;border-radius:10px;padding:8px 12px;font-weight:bold}
.tip{background:#f9fafb;border-radius:10px;padding:10px;margin:8px 0;font-size:13px}.timegoal{font-weight:bold}
</style>
</head>
<body>
<header><h1>FULL BODY 3x + 🃏 CORINGA</h1><div class="sub">Hipertrofia • corrida • ênfase em ombros e bíceps • até 1h20</div></header>
<main>
<div class="week">
<div><b>SEG</b><br>🏋️ A</div><div><b>TER</b><br>🏃 Corrida</div><div><b>QUA</b><br>🏋️ B</div>
<div><b>QUI</b><br>🏃 Corrida</div><div><b>SEX</b><br>🏋️ C</div><div><b>EXTRA</b><br>🃏 Coringa</div><div><b>DOM</b><br>😴 Descanso</div>
</div>

<div class="card">
  <div class="section-title">📊 PERSONAL VIRTUAL</div>
  <div class="small">Exporte seus registros ao fim da semana e envie o arquivo aqui no ChatGPT para análise.</div>
  <div class="row" style="margin-top:8px">
    <button class="save" onclick="exportWorkoutData()">📤 Exportar treinos</button>
    <button class="historybtn" onclick="document.getElementById('importFile').click()">📥 Restaurar backup</button>
  </div>
  <input id="importFile" type="file" accept=".json,application/json" class="hidden" onchange="importWorkoutData(event)">
  <button class="altbtn" onclick="showWeeklySummary()">📈 Resumo da semana</button>
  <div id="weeklySummary" class="hidden"></div>
</div>
<div class="tabs" id="tabs"></div><div id="app"></div>

</main>
<div id="modal" class="hidden"></div>
<script>
const W={
"A":{t:"TREINO A — SEGUNDA",f:"Full body • força/hipertrofia • peito + ombros + bíceps",time:"≈ 65–75 min",type:"principal",e:[
["Agachamento livre",4,"6–8","2–3 min","CONVENCIONAL"],
["Supino reto com barra",3,"6–8","2–3 min","CLUSTER"],
["Remada curvada",3,"8–10","1:30–2 min","CONVENCIONAL"],
["Desenvolvimento com halteres",3,"8–10","1:30–2 min","CONVENCIONAL"],
["Elevação lateral",2,"12–15","60s","DROP-SET"],
["Rosca direta",3,"8–10","60–90s","REST-PAUSE"],
["Tríceps corda",2,"10–12","60s","CONVENCIONAL"],
["Abdominal com rolinho",2,"8–12","60s","CONVENCIONAL"]]},
"B":{t:"TREINO B — QUARTA",f:"Full body • pernas + costas • posterior de ombro + bíceps",time:"≈ 65–75 min",type:"principal",e:[
["Hack squat",4,"8–10","2 min","CONVENCIONAL"],
["Stiff com barra",3,"8–10","2 min","CONVENCIONAL"],
["Puxada frontal",3,"8–10","1:30–2 min","CONVENCIONAL"],
["Supino inclinado com halteres",3,"8–10","1:30–2 min","CONVENCIONAL"],
["Face pull",2,"12–15","45–60s","BI-SET"],
["Elevação lateral",2,"12–15","45–60s","BI-SET"],
["Rosca martelo",2,"10–12","60–90s","REST-PAUSE"],
["Panturrilha em pé",3,"10–15","60s","DROP-SET"],
["Abdominal infra",2,"10–15","60s","CONVENCIONAL"]]},
"C":{t:"TREINO C — SEXTA",f:"Full body • costas + ombros + braços • densidade controlada",time:"≈ 65–75 min",type:"principal",e:[
["Leg press 45°",3,"10–12","1:30–2 min","CONVENCIONAL"],
["Mesa flexora",2,"10–12","1:30","DROP-SET"],
["Remada fechada unilateral com halter",3,"8–12","1:30–2 min","CONVENCIONAL"],
["Supino inclinado",3,"8–10","1:30–2 min","CONVENCIONAL"],
["Desenvolvimento na máquina",3,"8–12","1:30–2 min","CLUSTER"],
["Elevação lateral",2,"12–20","45–60s","DROP-SET"],
["Rosca Scott",3,"8–12","60–90s","REST-PAUSE"],
["Tríceps corda",2,"10–15","45–60s","BI-SET"],
["Panturrilha sentado",2,"12–15","60s","BI-SET"]]},
"CORINGA":{t:"🃏 TREINO CORINGA — OPCIONAL",f:"Somente se estiver recuperado. Ombros + bíceps + pontos fracos, sem obrigação de completar.",time:"≈ 30–45 min",type:"cor",e:[
["Elevação lateral",3,"12–20","45–60s","BI-SET"],
["Face pull",3,"12–20","45–60s","BI-SET"],
["Desenvolvimento com halteres",2,"8–12","90s","CONVENCIONAL"],
["Rosca inclinada",2,"10–12","60s","DROP-SET"],
["Rosca martelo",2,"10–15","60s","REST-PAUSE"],
["Crucifixo inverso",2,"12–20","45–60s","CONVENCIONAL"],
["Panturrilha",2,"12–20","60s","DROP-SET"]]}
};

const INFO={
"CONVENCIONAL":{t:"SÉRIE CONVENCIONAL",b:"Faça a série normalmente, executando todas as repetições de forma contínua e controlada.",p:"Exemplo: 3 × 8–10 = faça 8 a 10 repetições, descanse o tempo indicado e repita. Termine normalmente com cerca de 1–3 RIR."},
"CLUSTER":{t:"CLUSTER",b:"Você NÃO faz todas as repetições seguidas. Divida a meta em pequenos blocos, usando microdescansos de 10–20 segundos entre eles.",p:"Exemplo: meta de 6–8 reps → 2 + 2 + 2 ou 3 + 2 + 2. Use a mesma carga. Depois do bloco completo, faça o descanso normal antes da próxima série."},
"DROP-SET":{t:"DROP-SET",b:"Faça a série planejada até ficar muito próximo da falha técnica. Sem descanso relevante, reduza a carga em cerca de 20–30% e continue fazendo repetições.",p:"Exemplo: 12 reps com 10 kg → reduza para 7–8 kg → faça mais reps até próximo da falha. O drop acontece somente na série marcada."},
"REST-PAUSE":{t:"REST-PAUSE",b:"Faça a série até próximo da falha técnica. Descanse apenas 15–20 segundos e volte à mesma carga para mais algumas repetições.",p:"Exemplo: 10 reps → 15–20s de descanso → 3–5 reps extras. Depois disso a série está encerrada."},
"BI-SET":{t:"BI-SET",b:"Faça os dois exercícios marcados como BI-SET em sequência, praticamente sem descanso entre eles. Só descanse depois de concluir os dois.",p:"Exemplo: Face pull → Elevação lateral → descanso 45–60s → repetir. O objetivo é aumentar a densidade sem aumentar muito o tempo total."}
};

const ALT={
"Agachamento livre":[["Hack squat","Mais estabilidade"],["Agachamento no Smith","Boa estabilidade"],["Leg press 45°","Alternativa quando não houver rack"]],
"Supino reto com barra":[["Supino reto com halteres","Alternativa direta"],["Chest press","Máquina"],["Supino no Smith","Mais estabilidade"]],
"Supino inclinado com halteres":[["Supino inclinado no Smith","Alternativa estável"],["Chest press inclinado","Máquina"],["Supino inclinado com barra","Alternativa livre"]],
"Supino inclinado":[["Supino inclinado com halteres","Alternativa direta"],["Chest press inclinado","Máquina"],["Supino inclinado no Smith","Mais estabilidade"]],
"Remada curvada":[["Remada baixa","Cabo"],["Remada máquina articulada","Mais estabilidade"],["Remada apoiada no banco","Menos sobrecarga lombar"]],
"Remada fechada unilateral com halter":[["Remada unilateral no cabo","Tensão constante"],["Remada máquina unilateral","Mais estabilidade"],["Remada apoiada no banco","Menos exigência lombar"]],
"Puxada frontal":[["Puxada neutra","Variação de pegada"],["Barra fixa assistida","Alternativa vertical"],["Puxada unilateral no cabo","Variação unilateral"]],
"Stiff com barra":[["Terra romeno com halteres","Alternativa direta"],["Stiff no Smith","Mais estabilidade"],["Mesa flexora","Padrão diferente"]],
"Hack squat":[["Agachamento no Smith","Alternativa próxima"],["Leg press 45°","Boa substituição"],["Agachamento livre","Maior exigência técnica"]],
"Leg press 45°":[["Hack squat","Alternativa próxima"],["Agachamento no Smith","Boa substituição"],["Agachamento livre","Maior exigência técnica"]],
"Mesa flexora":[["Flexora sentada","Alternativa"],["Mesa flexora unilateral","Variação unilateral"],["Stiff leve","Padrão diferente"]],
"Desenvolvimento com halteres":[["Desenvolvimento na máquina","Mais estabilidade"],["Desenvolvimento no Smith","Alternativa"],["Arnold press","Variação"]],
"Desenvolvimento na máquina":[["Desenvolvimento com halteres","Alternativa livre"],["Desenvolvimento no Smith","Alternativa"],["Arnold press","Variação"]],
"Elevação lateral":[["Elevação lateral na máquina","Tensão constante"],["Elevação lateral no cabo","Boa curva de resistência"],["Elevação lateral unilateral","Maior controle"]],
"Face pull":[["Crucifixo inverso","Deltoide posterior"],["Reverse peck deck","Máquina"],["Elevação posterior com halteres","Alternativa livre"]],
"Crucifixo inverso":[["Reverse peck deck","Máquina"],["Face pull","Cabo"],["Elevação posterior com halteres","Alternativa livre"]],
"Rosca direta":[["Rosca barra W","Conforto para punhos"],["Rosca no cabo","Tensão constante"],["Rosca alternada","Unilateral"]],
"Rosca inclinada":[["Rosca alternada","Alternativa direta"],["Rosca no cabo","Tensão constante"],["Rosca concentrada","Maior isolamento"]],
"Rosca martelo":[["Rosca martelo no cabo","Tensão constante"],["Rosca corda","Cabo"],["Rosca cruzada","Variação"]],
"Rosca Scott":[["Rosca Scott com halteres","Unilateral"],["Rosca máquina","Mais estabilidade"],["Rosca no cabo","Alternativa"]],
"Tríceps corda":[["Tríceps barra no pulley","Alternativa direta"],["Tríceps francês","Ênfase cabeça longa"],["Tríceps máquina","Mais estabilidade"]],
"Panturrilha em pé":[["Panturrilha no leg press","Alternativa"],["Panturrilha sentado","Mais sóleo"],["Máquina em pé","Alternativa"]],
"Panturrilha sentado":[["Panturrilha em pé","Mais gastrocnêmio"],["Panturrilha no leg press","Alternativa"],["Máquina sentado","Alternativa"]],
"Panturrilha":[["Panturrilha em pé","Alternativa"],["Panturrilha sentado","Alternativa"],["Panturrilha no leg press","Alternativa"]],
"Abdominal com rolinho":[["Prancha","Alternativa simples"],["Abdominal na polia","Sobrecarga"],["Dead bug","Controle do core"]],
"Abdominal infra":[["Elevação de joelhos","Alternativa"],["Reverse crunch","Alternativa"],["Elevação de pernas no banco","Alternativa"]]
};

let d="A",timer=null,sec=0;
const key=(d,i,s,f)=>`fb3_${d}_${i}_${s}_${f}`;
const get=k=>localStorage.getItem(k)||"";
const set=(k,v)=>localStorage.setItem(k,v);
function currentName(i){return get(`chosen_${d}_${i}`)||W[d].e[i][0]}
function exerciseId(name){return name.replace(/[^a-zA-Z0-9]/g,"_")}
function historyKey(i){return "history_fb3_"+exerciseId(currentName(i))}
function chooseAlt(i,name){const original=W[d].e[i][0];set(`chosen_${d}_${i}`,name);set(`obs_${d}_${i}`,`Substituição: ${original} → ${name}. `);render()}
function saveHistory(i){
 const ex=W[d].e[i],sets=[];for(let s=1;s<=ex[1];s++)sets.push({kg:get(key(d,i,s,"kg")),reps:get(key(d,i,s,"reps"))});
 const obs=get(`obs_${d}_${i}`),dif=get(`dif_${d}_${i}`);
 if(!sets.some(x=>x.kg||x.reps)&&!obs&&!dif){alert("Registre algum dado antes de salvar.");return}
 const hist=JSON.parse(localStorage.getItem(historyKey(i))||"[]");
 hist.unshift({date:new Date().toLocaleString("pt-BR"),sets,obs,dif,name:currentName(i)});
 localStorage.setItem(historyKey(i),JSON.stringify(hist.slice(0,50)));alert("Execução registrada no histórico!");render()
}
function showHistory(i){
 const hist=JSON.parse(localStorage.getItem(historyKey(i))||"[]"),box=document.getElementById(`hist_${i}`);
 if(!hist.length){box.innerHTML="<div class='history'>Ainda não há histórico registrado para este exercício.</div>";box.classList.remove("hidden");return}
 box.innerHTML=hist.slice(0,6).map(h=>{const ss=h.sets.map((x,n)=>`S${n+1}: ${x.kg||"—"} kg × ${x.reps||"—"}`).join(" | ");return `<div class='history'><b>${h.date}</b><br>${ss}${h.dif?`<br>Dificuldade: ${h.dif}`:""}${h.obs?`<br>📝 ${h.obs}`:""}</div>`}).join("");box.classList.remove("hidden")
}
function toggleAlt(i){document.getElementById(`alts_${i}`).classList.toggle("hidden")}
function info(type){
 const normalized=type.split(" • ")[0].trim().toUpperCase();
 const x=INFO[normalized]||INFO["CONVENCIONAL"];
 document.getElementById("modal").innerHTML=`<div class="modal" onclick="if(event.target===this)closeInfo()"><div class="modalbox"><button class="close" onclick="closeInfo()">Fechar</button><h3>ⓘ ${x.t}</h3><div class="tip">${x.b}</div><div class="tip"><b>Como lembrar:</b> ${x.p}</div></div></div>`;
 document.getElementById("modal").classList.remove("hidden")
}
function closeInfo(){document.getElementById("modal").classList.add("hidden")}

function exportWorkoutData(){
  const prefixKeys=[];
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k && (k.startsWith("fb3_") || k.startsWith("history_fb3_") || k.startsWith("chosen_") || k.startsWith("obs_") || k.startsWith("dif_") || k.startsWith("done_") || k.startsWith("sum_"))) prefixKeys.push(k);
  }
  const data={
    app:"Full Body — Personal Virtual",
    version:"2.1",
    exportedAt:new Date().toISOString(),
    workouts:W,
    storage:{}
  };
  prefixKeys.forEach(k=>data.storage[k]=localStorage.getItem(k));
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  const d0=new Date();
  const stamp=d0.toISOString().slice(0,10);
  a.href=url;a.download=`FullBody_Raphael_${stamp}.json`;
  document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
  alert("Backup/exportação gerado. Envie este arquivo aqui no ChatGPT para a análise do Personal Virtual.");
}
function importWorkoutData(ev){
  const file=ev.target.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      if(!data.storage) throw new Error("Formato inválido");
      if(!confirm("Restaurar este backup pode substituir registros atuais. Continuar?")) return;
      Object.entries(data.storage).forEach(([k,v])=>localStorage.setItem(k,v));
      alert("Backup restaurado. O aplicativo será atualizado.");
      render();
    }catch(e){alert("Não foi possível restaurar este arquivo.")}
  };
  reader.readAsText(file);
}
function collectHistory(){
  const all=[];
  Object.keys(W).forEach(day=>{
    W[day].e.forEach((ex,i)=>{
      const name=localStorage.getItem(`chosen_${day}_${i}`)||ex[0];
      const hist=JSON.parse(localStorage.getItem("history_fb3_"+exerciseId(name))||"[]");
      hist.forEach(h=>all.push({...h,day,exercise:name}));
    });
  });
  return all.sort((a,b)=>new Date(a.date)-new Date(b.date));
}
function showWeeklySummary(){
  const box=document.getElementById("weeklySummary");
  const all=collectHistory();
  const weekAgo=Date.now()-7*24*60*60*1000;
  const recent=all.filter(x=>{const t=Date.parse(x.date);return !isNaN(t)&&t>=weekAgo});
  const sessions={}; recent.forEach(x=>{sessions[x.date]=true});
  let totalSets=0,totalReps=0,fail=0,heavy=0;
  recent.forEach(x=>{
    totalSets+=x.sets.filter(s=>s.kg||s.reps).length;
    totalReps+=x.sets.reduce((n,s)=>n+(parseInt(s.reps)||0),0);
    if(x.dif==="Falha")fail++; if(x.dif==="Muito pesado")heavy++;
  });
  box.innerHTML=`<div class="history">
    <b>Últimos 7 dias</b><br>
    Execuções registradas: ${recent.length}<br>
    Séries com dados: ${totalSets}<br>
    Repetições registradas: ${totalReps}<br>
    Registros em falha: ${fail}<br>
    Registros muito pesados: ${heavy}<br><br>
    <b>Próximo passo:</b> exporte os treinos e envie o arquivo aqui. O Personal Virtual poderá comparar cargas, repetições, dificuldade e observações.
  </div>`;
  box.classList.remove("hidden");
}

function render(){
 tabs.innerHTML=Object.keys(W).map(x=>`<button class="tab ${x===d?"active":""}" onclick="d='${x}';render()">${x==="CORINGA"?"🃏 CORINGA":"TREINO "+x}</button>`).join("");
 const w=W[d],done=w.e.filter((_,i)=>get(`done_${d}_${i}`)==="1").length;
 const exercises=w.e.map((e,i)=>{
  const original=e[0],name=currentName(i),chosen=name!==original;
  let sets="";for(let s=1;s<=e[1];s++)sets+=`<div class="set"><div class="settitle">SÉRIE ${s}<span class="badge">${e[2]} reps</span></div><div class="row"><input placeholder="Peso (kg)" inputmode="decimal" value="${get(key(d,i,s,"kg"))}" onchange="set('${key(d,i,s,"kg")}',this.value)"><input placeholder="Repetições feitas" inputmode="numeric" value="${get(key(d,i,s,"reps"))}" onchange="set('${key(d,i,s,"reps")}',this.value)"></div></div>`;
  const alternatives=(ALT[original]||[]).map(a=>`<div class="altitem"><b>${a[0]}</b><span>${a[1]}</span><button class="altbtn" onclick="chooseAlt(${i},'${a[0]}')">Usar esta alternativa hoje</button></div>`).join("")||"<div class='small'>Nenhuma alternativa cadastrada ainda.</div>";
  return `<div class="exercise ${get(`done_${d}_${i}`)==="1"?"done":""}">
  <div class="exhead"><div><div class="exname">${i+1}. ${name}</div>${chosen?`<div class="altchosen">🔄 Alternativa de: ${original}</div>`:""}<div class="meta">${e[1]} séries × ${e[2]} • Descanso: ${e[3]}</div>
  <div class="stim"><span class="stimname">${e[4]}</span><button class="infoBtn" onclick="info('${e[4]}')">i</button></div><div class="small"><b>${e[4]==="BI-SET"?"Como fazer: execute com o exercício BI-SET consecutivo, depois descanse.":e[4]==="CLUSTER"?"Como fazer: divida as reps em blocos com 10–20s de microdescanso.":e[4]==="DROP-SET"?"Como fazer: última série, reduza 20–30% da carga e continue.":e[4]==="REST-PAUSE"?"Como fazer: após a série, 15–20s de pausa e mais algumas reps.":"Como fazer: repetições contínuas com técnica controlada."}</b></div></div><button class="arrow" onclick="toggleAlt(${i})">⌄</button></div>
  <div id="alts_${i}" class="alts hidden"><h4>🔄 Exercícios alternativos</h4>${alternatives}${chosen?`<button class="altbtn" onclick="localStorage.removeItem('chosen_${d}_${i}');render()">↩ Voltar ao exercício original</button>`:""}</div>
  ${sets}
  <select onchange="set('dif_${d}_${i}',this.value)"><option value="">Dificuldade percebida</option>${["Fácil","Moderado","Pesado","Muito pesado","Falha"].map(x=>`<option ${get(`dif_${d}_${i}`)===x?"selected":""}>${x}</option>`).join("")}</select>
  <textarea placeholder="📝 Observações: adaptação, dor, técnica, equipamento ou informação importante..." onchange="set('obs_${d}_${i}',this.value)">${get(`obs_${d}_${i}`)}</textarea>
  <button class="save" onclick="saveHistory(${i})">💾 Registrar execução</button><button class="historybtn" onclick="showHistory(${i})">📊 Ver últimas execuções</button><div id="hist_${i}" class="hidden"></div>
  <button class="check" onclick="set('done_${d}_${i}',get('done_${d}_${i}')==='1'?'0':'1');render()">${get(`done_${d}_${i}`)==="1"?"✓ Exercício concluído":"Concluir exercício"}</button></div>`
 }).join("");
 app.innerHTML=`<div class="card ${w.type==="cor"?"corinfo":""}"><div class="section-title">${w.t}</div><div class="small">${w.f}</div><div class="timegoal">⏱️ Tempo-alvo: ${w.time}</div><div class="small">${done}/${w.e.length} exercícios concluídos</div><div class="progress"><div class="bar" style="width:${done/w.e.length*100}%"></div></div></div>
 ${w.type==="cor"?`<div class="card corinfo"><b>Regra do Coringa</b><div class="small">Opcional. Faça apenas se estiver recuperado. Se houver queda de desempenho, fadiga importante ou dor persistente, não use volume extra.</div></div>`:""}
 <div class="card goal"><b>🎯 Regra de progressão</b><div class="small">As séries agora são <b>variadas</b> (2, 3 ou 4 conforme o exercício). Quando atingir o topo da faixa com boa técnica e dificuldade controlada, a próxima sessão pode pedir aumento de carga. As técnicas intensificadoras não substituem o controle de recuperação.</div></div>
 <div class="timer">CRONÔMETRO DE DESCANSO<div class="time" id="time">${fmt(sec)}</div><button onclick="start(45)">0:45</button><button onclick="start(60)">1:00</button><button onclick="start(90)">1:30</button><button onclick="start(120)">2:00</button><button onclick="start(180)">3:00</button><button onclick="stop()">Parar</button></div>
 <div class="card">${exercises}</div>
 <div class="card"><b>📝 Resumo geral</b><div class="small">Sono, corrida, recuperação, dores, disposição e qualquer adaptação importante.</div><textarea id="sum">${get("sum_"+d)}</textarea><button class="save" onclick="set('sum_'+d,document.getElementById('sum').value);alert('Resumo salvo!')">Salvar resumo</button></div>
 <div class="card"><b>📈 O que será acompanhado</b><div class="small">Carga, repetições, dificuldade, consistência, volume e observações. A análise semanal pode usar esses dados para ajustar progressão, volume, número de séries e técnicas.</div></div>`
}
function start(x){clearInterval(timer);sec=x;time.textContent=fmt(sec);timer=setInterval(()=>{sec--;time.textContent=fmt(Math.max(sec,0));if(sec<=0){clearInterval(timer);navigator.vibrate?.([300,150,300]);alert("Descanso concluído!")}},1000)}
function stop(){clearInterval(timer);sec=0;const t=document.getElementById("time");if(t)t.textContent="00:00"}
function fmt(x){return String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0")}
render();
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));
</script>
</body></html>
